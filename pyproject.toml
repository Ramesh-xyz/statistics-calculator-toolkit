[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdtoolkit"
version = "0.1.0"
description = "Dependency-free standard deviation, variance and relative standard deviation for Python"
readme = "docs/python.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ramesh-xyz" }]
keywords = ["standard deviation", "variance", "coefficient of variation", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://standarddeviationcalculator.net/"
Documentation = "https://ramesh-xyz.github.io/statistics-calculator-toolkit/python.html"
Source = "https://github.com/Ramesh-xyz/statistics-calculator-toolkit"
Issues = "https://github.com/Ramesh-xyz/statistics-calculator-toolkit/issues"
Changelog = "https://github.com/Ramesh-xyz/statistics-calculator-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
sdtoolkit = "sdtoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
