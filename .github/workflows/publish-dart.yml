name: publish-dart

# Uses pub.dev automated publishing (GitHub OIDC), no secret needed.
# One-time setup: publish 0.1.0 manually, then on pub.dev > sdtoolkit > Admin
# enable "Automated publishing from GitHub Actions" with repository
# Ramesh-xyz/statistics-calculator-toolkit and tag pattern dart-v{{version}},
# and tick "Enable publishing from workflow_dispatch events".
#
# Run it from the Actions tab on main: the `tag` job pushes dart-vX.Y.Z from
# pubspec.yaml and re-runs this workflow on that tag, because pub.dev only
# accepts publishes from runs whose ref is the tag.

on:
  workflow_dispatch:
  push:
    tags: ["dart-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  tag:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # start the run on the tag
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(sed -n 's/^version: *//p' dart/pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: dart-v${{ steps.v.outputs.version }}
      - run: gh workflow run publish-dart.yml --ref "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Check tag matches pubspec version
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "dart-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  publish:
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: dart
