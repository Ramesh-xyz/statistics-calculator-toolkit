name: publish-dotnet

on:
  workflow_dispatch:
  push:
    tags: ["dotnet-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/SdToolkit.Tests
      - run: dotnet pack src/SdToolkit -c Release -o out
      - id: v
        run: echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SdToolkit/SdToolkit.csproj)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: dotnet-v${{ steps.v.outputs.version }}
      - name: Publish to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
