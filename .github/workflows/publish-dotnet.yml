name: publish-dotnet

on:
  push:
    tags: ["dotnet-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Check tag matches csproj version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SdToolkit/SdToolkit.csproj)
          if [ "dotnet-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match csproj version $version"
            exit 1
          fi
      - run: dotnet test tests/SdToolkit.Tests
      - run: dotnet pack src/SdToolkit -c Release -o out
      - name: Publish to NuGet
        run: dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
