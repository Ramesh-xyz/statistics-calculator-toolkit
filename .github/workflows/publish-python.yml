name: publish-python

# Release: bump version in pyproject.toml and src/sdtoolkit/__init__.py,
# then push a tag `py-vX.Y.Z`.
on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check tag matches version
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(PYTHONPATH=src python -c "import sdtoolkit;print(sdtoolkit.__version__)")
          echo "tag=$tag pyproject=$pkg __version__=$mod"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$mod" ]
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
