name: publish-python

# Release: bump version in pyproject.toml and src/sdtoolkit/__init__.py, then
# either push a tag `py-vX.Y.Z` or run this workflow from the Actions tab on
# main (it tags the commit after publishing).
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # create the py-v tag on manual runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Check version
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_REF_NAME" = main ] || { echo "manual runs must use main"; exit 1; }
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(PYTHONPATH=src python -c "import sdtoolkit;print(sdtoolkit.__version__)")
          tag="${GITHUB_REF_NAME#py-v}"
          [ "$GITHUB_EVENT_NAME" = push ] || tag="$pkg"
          echo "tag=$tag pyproject=$pkg __version__=$mod"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$mod" ]
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "py-v$VERSION"
          git push origin "py-v$VERSION"
