name: publish-python

# Release: bump version in pyproject.toml and src/sdtoolkit/__init__.py,
# merge to main, then run this workflow from the Actions tab. It tags the
# commit `py-vX.Y.Z` and publishes. Pushing that tag yourself also works.
on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Read version
        id: v
        run: |
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(PYTHONPATH=src python -c "import sdtoolkit;print(sdtoolkit.__version__)")
          echo "pyproject=$pkg __version__=$mod"
          [ "$pkg" = "$mod" ]
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: py-v${{ steps.v.outputs.version }}
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
