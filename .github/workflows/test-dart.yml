name: test-dart

on:
  push:
    paths: ["dart/**", ".github/workflows/test-dart.yml"]
  pull_request:
    paths: ["dart/**", ".github/workflows/test-dart.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.5.0", "stable"]
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze
        if: matrix.sdk == 'stable'
      - run: dart test
      - run: dart pub publish --dry-run
        if: matrix.sdk == 'stable'
