name: test-python

on:
  push:
    paths: ["src/**", "tests/**", "examples/**", "pyproject.toml", "docs/python.md", ".github/workflows/test-python.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "examples/**", "pyproject.toml", "docs/python.md", ".github/workflows/test-python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
