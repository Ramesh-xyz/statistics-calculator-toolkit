# Tells Packagist about a new PHP release. Run it from the Actions tab with the
# new version: it tests, pushes the tag vX.Y.Z, then notifies Packagist.
#
# Packagist builds versions from git tags and ignores tags it cannot parse as
# versions (such as php-v0.1.0), so PHP releases use plain vX.Y.Z tags.
# Packagist serves GitHub's zipball of the tag, which contains the whole
# repository; composer.json "archive.exclude" only affects `composer archive`.
#
# One-time setup: submit https://github.com/Ramesh-xyz/statistics-calculator-toolkit
# at https://packagist.org/packages/submit while logged in as the maintainer.
# Secrets: PACKAGIST_USERNAME, PACKAGIST_TOKEN (the "safe" API token from
# https://packagist.org/profile/).
name: publish-php

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.1"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$VERSION is not X.Y.Z"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: v${{ steps.v.outputs.version }}
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -sf -o /dev/null -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/Ramesh-xyz/statistics-calculator-toolkit"}}'
