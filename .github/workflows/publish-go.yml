name: publish-go

# Go has no upload step: a module version is the git tag
# go/sdtoolkit/vX.Y.Z. Run this workflow from the Actions tab with the new
# version: it tests the commit, pushes the tag, then asks proxy.golang.org
# for that version so pkg.go.dev indexes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.1"
        required: true
  push:
    tags: ["go/sdtoolkit/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: go/sdtoolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./... && go test -v ./...
      - id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#go/sdtoolkit/v}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: go/sdtoolkit/v${{ steps.v.outputs.version }}
      - name: Fetch the version through the module proxy
        env:
          MODULE: github.com/Ramesh-xyz/statistics-calculator-toolkit/go/sdtoolkit
        run: |
          version="${TAG#go/sdtoolkit/}"
          cd "$RUNNER_TEMP"
          GOPROXY=https://proxy.golang.org GO111MODULE=on go list -m "$MODULE@$version"
          echo "https://pkg.go.dev/$MODULE@$version"
