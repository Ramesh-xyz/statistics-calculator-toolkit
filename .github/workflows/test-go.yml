name: test-go

on:
  push:
    paths: ["go/**", ".github/workflows/test-go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/test-go.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "stable"]
    defaults:
      run:
        working-directory: go/sdtoolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -v ./...
