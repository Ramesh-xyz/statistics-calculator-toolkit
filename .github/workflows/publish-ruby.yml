# Publishes the Ruby gem to RubyGems. Run it from the Actions tab: it tags the
# commit ruby-vX.Y.Z from lib/sdtoolkit/version.rb, then pushes the gem.
#
# Secret: RUBYGEMS_API_KEY — a rubygems.org API key with only the
# "Push rubygem" scope (restrict it to the sdtoolkit gem after the first push).
# If your rubygems.org account MFA level is "UI and API", key-based pushes
# need an OTP and will fail; use "UI and gem signin" or switch this job to
# trusted publishing (rubygems/configure-rubygems-credentials with id-token).
name: publish-ruby

on:
  workflow_dispatch:
  push:
    tags: ["ruby-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install minitest bigdecimal --no-document
      - run: ruby -Ilib test/test_sdtoolkit.rb
      - run: gem build sdtoolkit.gemspec
      - id: v
        run: echo "version=$(ruby -Ilib -e 'require "sdtoolkit/version"; print SDToolkit::VERSION')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/create-tag
        with:
          tag: ruby-v${{ steps.v.outputs.version }}
      - name: Push to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push sdtoolkit-*.gem
