# Builds and checks the R package. Run it from the Actions tab: it tags the
# commit r-vX.Y.Z from r/DESCRIPTION first.
#
# CRAN has no upload API: this workflow does NOT submit to CRAN. It produces
# a checked sdcalc_X.Y.Z.tar.gz, attaches it to the workflow run and to the
# GitHub release for the tag. Submit that file by hand at
# https://cran.r-project.org/submit.html and confirm the email CRAN sends to
# the maintainer address in r/DESCRIPTION.
name: publish-r

on:
  workflow_dispatch:
  push:
    tags: ["r-v*"]

permissions:
  contents: write  # to attach the tarball to the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Read version
        run: echo "VERSION=$(Rscript -e 'cat(read.dcf("DESCRIPTION", fields = "Version"))')" >> "$GITHUB_ENV"
      - name: Build
        run: R CMD build .
      - name: Check as CRAN
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: R CMD check --as-cran --no-manual "sdcalc_${VERSION}.tar.gz"
      - uses: ./.github/actions/create-tag
        with:
          tag: r-v${{ env.VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: sdcalc-cran-tarball
          path: r/sdcalc_*.tar.gz
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "sdcalc $VERSION (R)" --notes "CRAN submission tarball for sdcalc $VERSION."
          gh release upload "$TAG" "sdcalc_${VERSION}.tar.gz" --clobber
